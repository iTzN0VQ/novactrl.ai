<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="pt-title">
  <title id="pt-title">Pressure-Temperature chart for HVAC refrigerants</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#06080d"/>
      <stop offset="100%" stop-color="#0d1320"/>
    </linearGradient>
    <linearGradient id="g410" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"  stop-color="#00d9ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00d9ff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="g454" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"  stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="g32" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"  stop-color="#fbbf24" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="1000" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="80" y1="100"  x2="760" y2="100"/>
    <line x1="80" y1="250"  x2="760" y2="250"/>
    <line x1="80" y1="400"  x2="760" y2="400"/>
    <line x1="80" y1="550"  x2="760" y2="550"/>
    <line x1="80" y1="700"  x2="760" y2="700"/>
    <line x1="80" y1="850"  x2="760" y2="850"/>
    <line x1="200" y1="80" x2="200" y2="900"/>
    <line x1="350" y1="80" x2="350" y2="900"/>
    <line x1="500" y1="80" x2="500" y2="900"/>
    <line x1="650" y1="80" x2="650" y2="900"/>
  </g>

  <!-- Axes -->
  <line x1="80" y1="900" x2="760" y2="900" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
  <line x1="80" y1="80"  x2="80"  y2="900" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>

  <!-- Axis labels -->
  <g fill="rgba(255,255,255,0.55)" font-family="ui-monospace, SF Mono, monospace" font-size="20" letter-spacing="2">
    <text x="56" y="100" text-anchor="end">150°F</text>
    <text x="56" y="250" text-anchor="end">120°F</text>
    <text x="56" y="400" text-anchor="end">90°F</text>
    <text x="56" y="550" text-anchor="end">60°F</text>
    <text x="56" y="700" text-anchor="end">30°F</text>
    <text x="56" y="850" text-anchor="end">0°F</text>

    <text x="80"  y="940" text-anchor="middle">0</text>
    <text x="200" y="940" text-anchor="middle">100</text>
    <text x="350" y="940" text-anchor="middle">200</text>
    <text x="500" y="940" text-anchor="middle">300</text>
    <text x="650" y="940" text-anchor="middle">400</text>
    <text x="420" y="975" text-anchor="middle" font-size="22" letter-spacing="6" fill="rgba(255,255,255,0.4)">PRESSURE (PSIG)</text>
  </g>

  <!-- Title in upper-left, mono caps -->
  <g font-family="ui-monospace, SF Mono, monospace" letter-spacing="3" fill="#00d9ff">
    <text x="80" y="48" font-size="18">PT · 16 REFRIGERANTS</text>
  </g>
  <text x="80" y="74" fill="rgba(255,255,255,0.55)" font-family="ui-monospace, SF Mono, monospace" font-size="13" letter-spacing="2">PRESSURE → SATURATION TEMP</text>

  <!-- R-410A curve (cyan) — sample sat curve, approximated -->
  <path d="M 80,824 L 130,750 L 180,690 L 230,640 L 290,575 L 350,510 L 410,455 L 470,400 L 530,345 L 590,295 L 650,250 L 710,200 L 760,165"
        fill="none" stroke="url(#g410)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- R-454B curve (purple) — slightly higher pressure for same temp -->
  <path d="M 80,800 L 130,720 L 180,655 L 230,600 L 290,540 L 350,480 L 410,425 L 470,370 L 530,320 L 590,275 L 650,235 L 710,190 L 760,150"
        fill="none" stroke="url(#g454)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0"/>
  <!-- R-32 curve (amber) -->
  <path d="M 80,790 L 130,705 L 180,640 L 230,585 L 290,520 L 350,460 L 410,405 L 470,355 L 530,305 L 590,265 L 650,225 L 710,185 L 760,145"
        fill="none" stroke="url(#g32)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- Refrigerant labels -->
  <g font-family="ui-monospace, SF Mono, monospace" font-size="18" letter-spacing="1">
    <text x="770" y="170"  text-anchor="end" fill="#fbbf24">R-32</text>
    <text x="770" y="200"  text-anchor="end" fill="#a78bfa">R-454B</text>
    <text x="770" y="230"  text-anchor="end" fill="#00d9ff">R-410A</text>
  </g>

  <!-- Sample point — the kind of measurement Nova Claw expects -->
  <circle cx="350" cy="510" r="6" fill="#00d9ff"/>
  <circle cx="350" cy="510" r="14" fill="none" stroke="#00d9ff" stroke-opacity="0.4" stroke-width="2"/>
  <text x="370" y="500" font-family="ui-monospace, SF Mono, monospace" font-size="14" fill="#e8eaee" letter-spacing="1">200 psi → 90°F sat</text>
</svg>
